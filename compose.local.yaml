services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: substrata_jobs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d substrata_jobs"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - local-postgres:/var/lib/postgresql/data
      - ./test/fixtures/ops-schema.sql:/docker-entrypoint-initdb.d/001-ops-schema.sql:ro

  jobs:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      TRUST_PROXY: 1
      APP_BASE_URL: http://localhost:18080
      DATABASE_URL: postgresql://postgres:local-only-password@postgres:5432/substrata_jobs
      PGSSLMODE: disable
      RUN_MIGRATIONS: "true"
      SESSION_DURATION_DAYS: 1
      COOKIE_SECURE: "false"
      FIELD_API_URL: http://host.docker.internal:18081
      FIELD_BASE_URL: http://localhost:18081
      FIELD_JOBS_KEY: local-jobs-field-key
      SIGNATURE_ENCRYPTION_KEY: bG9jYWwtdGVzdC1zaWduYXR1cmUta2V5LTAwMDAwMDA=
      SIGNATURE_KEY_ID: local-v1
      EMAIL_PROVIDER: local_smtp
      EMAIL_FROM: substrata-jobs@example.test
      EMAIL_REPLY_TO: substrata-jobs@example.test
      EMAIL_ALLOW_LOCAL_CAPTURE: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "127.0.0.1:18080:8080"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:18082:8025"

volumes:
  local-postgres:
